name: reproducibility
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,paper]'
      - run: python scripts/verify_release.py
      - run: python -m pytest
      - run: bash scripts/reproduce_cpu.sh
